    // --- 資料庫：鋼管與常用風管規格 ---

        { sizeStr: "40A (1-1/2\")", inch: 1.5, D: 48.6, t: 2.8, w: 3.16 },
        { sizeStr: "50A (2\")", inch: 2.0, D: 60.5, t: 2.8, w: 3.98 },
        { sizeStr: "65A (2-1/2\")", inch: 2.5, D: 76.3, t: 3.0, w: 5.42 },
        { sizeStr: "80A (3\")", inch: 3.0, D: 89.1, t: 3.0, w: 6.37 },
        { sizeStr: "100A (4\")", inch: 4.0, D: 114.3, t: 3.0, w: 8.23 },
        { sizeStr: "125A (5\")", inch: 5.0, D: 139.8, t: 3.4, w: 11.4 },
        { sizeStr: "150A (6\")", inch: 6.0, D: 165.2, t: 3.4, w: 13.6 },
        { sizeStr: "200A (8\")", inch: 8.0, D: 216.3, t: 4.0, w: 20.9 }
      ]
    };

    // --- 精確硬編碼：橫向配管支撐間隔與吊桿對照表 ---
    const spacingDatabase = {
      "鍍鋅鋼管 (CNS 6445 / CNS 4626)": [
        { limit: 20, spacing: 1.8, rod: "9mm (3/8\")" },
        { limit: 40, spacing: 2.0, rod: "9mm (3/8\")" },
        { limit: 80, spacing: 3.0, rod: "9mm (3/8\")" },
        { limit: 150, spacing: 4.0, rod: "12mm (1/2\")" },
        { limit: 999, spacing: 5.0, rod: "15mm (5/8\")" }
      ],
      "鍍鋅鋼管 (EMT電線管)": [
        { limit: 20, spacing: 1.0, rod: "9mm (3/8\")" },
        { limit: 40, spacing: 1.5, rod: "9mm (3/8\")" },
        { limit: 50, spacing: 2.0, rod: "9mm (3/8\")" },
        { limit: 999, spacing: 2.0, rod: "9mm (3/8\")" }
      ],
      "排煙風管": [
        { limit: 300, spacing: 3.0, rod: "9mm (3/8\")" },
        { limit: 750, spacing: 2.7, rod: "9mm (3/8\")" },
        { limit: 999, spacing: 2.4, rod: "9mm (3/8\")" }
      ]
    };

    const safetyFactors = [
      { label: "一般流體靜態管路 (給排水 ×1.5)", factor: 1.5 },
      { label: "動態衝擊管路 (消防水錘 / 冰水泵浦 ×1.8)", factor: 1.8 },
      { label: "重級防震 / 化學危險管路 (×2.0)", factor: 2.0 }
    ];

    const supportStyles = [
      { id: "single", name: "單管懸吊吊架", desc: "鋼構或樓板錨定，以螺桿下吊 clevis 雙層管束。" },
      { id: "trapeze", name: "門型型鋼排架", desc: "兩側支撐搭配橫擔 C型鋼 / 槽鐵 固定多支管路。" },
      { id: "cantilever", name: "三角懸臂支架", desc: "牆面重型三角角鋼托架 (SP42)，抗剪切剛性大。" },
      { id: "riser", name: "樓板落地立管架", desc: "立管穿樓板專用雙片式對鎖重型固定架 (SP27)。" }
    ];

    const structureTypes = [
      { id: "rc", name: "RC 混凝土結構", desc: "依靠金屬膨脹螺栓（壁虎）或高強度化學錨栓錨定。" },
      { id: "steel", name: "鋼骨結構 (H型鋼/I型鋼翼板)", desc: "依靠免電焊銲鋼構夾具（萬能夾/虎口夾）固定。" },
      { id: "roof", name: "鋼構斜屋頂/鐵皮房結構", desc: "需使用萬向鉸接吊架以調校垂直偏角防止受力折減。" }
    ];

    function App() {
      const [standard, setStandard] = useState("CNS 6445 (一般配管碳鋼管)");
      const [pipeIndex, setPipeIndex] = useState(8);
      const [safety, setSafety] = useState(safetyFactors[1].factor);
      const [styleId, setStyleId] = useState("trapeze");
      const [spacingMaterial, setSpacingMaterial] = useState("鍍鋅鋼管 (CNS 6445 / CNS 4626)");
      
      const [isHardSupport, setIsHardSupport] = useState(true);
      
      const [structureId, setStructureId] = useState("rc");
      const [addVibration, setAddVibration] = useState(true);
      const [addSleeve, setAddSleeve] = useState(false);

      const [useInsulation, setUseInsulation] = useState(false);
      const [addWorkerLoad, setAddWorkerLoad] = useState(false);
      const [customSpacing, setCustomSpacing] = useState(null); 
      const [activeTab, setActiveTab] = useState("bom");

      const [calcData, setCalcData] = useState({ 
        emptyWeight: 0, 
        waterWeight: 0, 
        insulationWeight: 0,
        totalWeight: 0, 
        designLoadPerMeter: 0,
        recommendedSpacing: 4.0,
        activeSpacing: 4.0,
        nodeLoad: 0 
      });
      
      const [currentPipe, setCurrentPipe] = useState(pipeData[standard][0]);

      useEffect(() => {
        const pipeList = pipeData[standard];
        const safeIndex = pipeIndex < pipeList.length ? pipeIndex : 0;
        const pipe = pipeList[safeIndex];
        setCurrentPipe(pipe);
        
        const d = pipe.D - (2 * pipe.t);
        const waterW = 0.000785 * Math.pow(d, 2);
        
        let insulationW = 0;
        if (useInsulation) {
          insulationW = pipe.inch <= 2 ? 0.9 + (pipe.D * 0.015) : 2.0 + (pipe.D * 0.04);
        }

        const totalW = pipe.w + waterW + insulationW;
        const designL = totalW * safety;

        const ruleList = spacingDatabase[spacingMaterial] || spacingDatabase["鍍鋅鋼管 (CNS 6445 / CNS 4626)"];
        const nominalValue = parseInt(pipe.sizeStr);
        
        let recSpacing = 4.0;
        let matchedRule = ruleList.find(r => nominalValue <= r.limit);
        if (matchedRule) {
          recSpacing = matchedRule.spacing;
        } else {
          recSpacing = ruleList[ruleList.length - 1].spacing;
        }

        const activeSpacing = customSpacing !== null ? customSpacing : recSpacing;

        let nodeLoadCalc = designL * activeSpacing;
        if (addWorkerLoad) {
          nodeLoadCalc += 100;
        }

        setCalcData({
          emptyWeight: pipe.w,
          waterWeight: waterW,
          insulationWeight: insulationW,
          totalWeight: totalW,
          designLoadPerMeter: designL,
          recommendedSpacing: recSpacing,
          activeSpacing: activeSpacing,
          nodeLoad: nodeLoadCalc
        });
      }, [standard, pipeIndex, safety, useInsulation, addWorkerLoad, customSpacing, spacingMaterial]);

      const getCatalogMatch = () => {
        const inch = currentPipe.inch;
        const isSUS = standard.includes("不鏽鋼");
        const nodeL = calcData.nodeLoad;

        let res = {
          band: { code: "", specs: "", load: "" },
          uBolt: { code: "", thread: "", load: "" },
          rod: { code: "", diameter: "", load: "" },
          angle: { code: "", specs: "", weight: "" },
          channel: { code: "", specs: "", weight: "", plate: "" },
          springNut: { code: "", size: "" },
          vibration: { code: "", specs: "", loadRange: "", color: "", hex: "" },
          couplingNut: { code: "", specs: "", load: "" },
          steelClamp: { code: "", specs: "", load: "" }
        };

        if (nodeL <= 112) {
          res.rod = { code: "T2100 / T2300", diameter: "1/4\"", load: "112 kg" };
          res.couplingNut = { code: "SK20 / SKH20", specs: "1/4\" L=22~26mm", load: "400 kg" };
          res.springNut = { code: "CN 20", size: "1/4\"" };
        } else if (nodeL <= 189) {
          res.rod = { code: "T25100", diameter: "5/16\"", load: "189 kg" };
          res.couplingNut = { code: "SK2030XX (異徑)", specs: "內 1/4\" x 內 3/8\"", load: "—" };
          res.springNut = { code: "CN 25", size: "5/16\"" };
        } else if (nodeL <= 282) {
          res.rod = { code: "T3100 / T3300", diameter: "3/8\"", load: "282 kg" };
          res.couplingNut = { code: "SK30 / SKH30", specs: "3/8\" L=40mm", load: "520 kg" };
          res.springNut = { code: "CN 30", size: "3/8\"" };
        } else if (nodeL <= 502) {
          res.rod = { code: "T4100 / T4300", diameter: "1/2\"", load: "502 kg" };
          res.couplingNut = { code: "SK40 / SKH40", specs: "1/2\" L=50mm", load: "690 kg" };
          res.springNut = { code: "CN 40", size: "1/2\"" };
        } else if (nodeL <= 839) {
          res.rod = { code: "T5100 / T5300", diameter: "5/8\"", load: "839 kg" };
          res.couplingNut = { code: "SK50 / SKH50", specs: "5/8\" L=53mm", load: "1160 kg" };
          res.springNut = { code: "CN 50", size: "5/8\"" };
        } else {
          res.rod = { code: "T6100 / T6300", diameter: "3/4\"", load: "1255 kg" };
          res.couplingNut = { code: "SK60", specs: "3/4\" L=53mm", load: "1130 kg" };
          res.springNut = { code: "CN 60", size: "3/4\"" };
        }

        const stHangers = [
          { maxInch: 0.5, code: "ST 304", thread: "3/8\"", plate: "2.6x25 mm" },
          { maxInch: 0.75, code: "ST 306", thread: "3/8\"", plate: "2.6x25 mm" },
          { maxInch: 1.0, code: "ST 310", thread: "3/8\"", plate: "3x25 mm" },
          { maxInch: 1.25, code: "ST 312", thread: "3/8\"", plate: "3x25 mm" },
          { maxInch: 1.5, code: "ST 314", thread: "3/8\"", plate: "3x25 mm" },
          { maxInch: 2.0, code: "ST 320", thread: "3/8\"", plate: "3x25 mm" },
          { maxInch: 2.5, code: "ST 424", thread: "1/2\"", plate: "4x32 mm" },
          { maxInch: 3.0, code: "ST 430", thread: "1/2\"", plate: "4x32 mm" },
          { maxInch: 4.0, code: "ST 440", thread: "1/2\"", plate: "6x32 mm" },
          { maxInch: 5.0, code: "ST 550", thread: "5/8\"", plate: "6x38 mm" },
          { maxInch: 6.0, code: "ST 560", thread: "5/8\"", plate: "6x38 mm" },
          { maxInch: 8.0, code: "ST 680", thread: "3/4\"", plate: "6x45 mm" },
          { maxInch: 10.0, code: "ST 6100", thread: "3/4\"", plate: "9x45 mm" },
          { maxInch: 12.0, code: "ST 6120", thread: "3/4\"", plate: "9x45 mm" }
        ];
        const matchedST = stHangers.find(h => inch <= h.maxInch) || stHangers[stHangers.length - 1];
        res.band = { code: matchedST.code, specs: `穿孔:${matchedST.thread} | 鐵板:${matchedST.plate}`, load: "安全率 5" };

        let uBoltCode = "U304";
        let uBoltThread = "3/8\"";
        let uBoltLoad = "550 kg";

        if (inch <= 0.5) { uBoltCode = "U304"; uBoltThread = "3/8\""; uBoltLoad = "550 kg"; }
        else if (inch <= 0.75) { uBoltCode = "U306"; uBoltThread = "3/8\""; uBoltLoad = "550 kg"; }
        else if (inch <= 1.0) { uBoltCode = "U310"; uBoltThread = "3/8\""; uBoltLoad = "550 kg"; }
        else if (inch <= 1.5) { uBoltCode = "U314"; uBoltThread = "3/8\""; uBoltLoad = "550 kg"; }
        else if (inch <= 2.0) { uBoltCode = "U320"; uBoltThread = "3/8\""; uBoltLoad = "550 kg"; }
        else if (inch <= 2.5) { uBoltCode = "U324"; uBoltThread = "3/8\""; uBoltLoad = "550 kg"; }
        else if (inch <= 3.0) { uBoltCode = "U430"; uBoltThread = "1/2\""; uBoltLoad = "1020 kg"; }
        else if (inch <= 4.0) { uBoltCode = "U440"; uBoltThread = "1/2\""; uBoltLoad = "1020 kg"; }
        else if (inch <= 6.0) { uBoltCode = "U460"; uBoltThread = "1/2\""; uBoltLoad = "1020 kg"; }
        else if (inch <= 8.0) { uBoltCode = "U580"; uBoltThread = "5/8\""; uBoltLoad = "1640 kg"; }
        else if (inch <= 10.0) { uBoltCode = "U5100"; uBoltThread = "5/8\""; uBoltLoad = "1640 kg"; }
        else { uBoltCode = "U6120"; uBoltThread = "3/4\""; uBoltLoad = "2640 kg"; }

        res.uBolt = { code: uBoltCode, thread: uBoltThread, load: uBoltLoad };

        if (inch <= 1.5) {
          res.angle = { code: "AG 3823", specs: "38×38 × 2.3t L=3M", weight: "1.344 kg/m" };
        } else if (inch <= 2.5) {
          res.angle = { code: "AG 5035", specs: "50×50 × 3.5t L=3M", weight: "2.680 kg/m" };
        } else if (inch <= 4.0) {
          res.angle = { code: "AG 505", specs: "50×50 × 5.0t L=3M", weight: "3.770 kg/m" };
        } else if (inch <= 6.0) {
          res.angle = { code: "AG 655", specs: "65×65 × 5.0t L=3M", weight: "5.000 kg/m" };
        } else {
          res.angle = { code: "AG 756", specs: "75×75 × 6.0t L=3M", weight: "6.850 kg/m" };
        }

        if (inch <= 2.5) {
          res.channel = { code: "E75405", specs: "75×40 × 5.0×7.0t L=3M", weight: "6.92 kg/m", plate: "150x150x5t" };
        } else if (inch <= 4.0) {
          res.channel = { code: "E100505", specs: "100×50 × 5.0×7.5t L=3M", weight: "9.36 kg/m", plate: "150x150x6t" };
        } else if (inch <= 6.0) {

                              <tr className="bg-slate-50/30">
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-04</td>
                                <td className="px-3 py-2.5 font-bold text-slate-800 border-r border-slate-200">每公尺設計荷重 (DL)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">(Ws + Ww + Wi) * 安全係數 ({safety})</td>
                                <td className="px-3 py-2.5 text-right font-bold text-slate-800">{calcData.designLoadPerMeter.toFixed(2)} kg/m</td>
                              </tr>

                              <tr>
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-05</td>
                                <td className="px-3 py-2.5 font-bold text-slate-800 border-r border-slate-200">支座安裝跨距 (M)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">依規章比對</td>
                                <td className="px-3 py-2.5 text-right font-bold text-slate-800">{calcData.activeSpacing.toFixed(1)} M</td>
                              </tr>

                              <tr className="bg-amber-50/30">
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-06</td>
                                <td className="px-3 py-2.5 font-bold text-slate-900 border-r border-slate-200">單一節點受力荷重 (Node Load)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">DL * 跨距 + 活載重 (100kg, {addWorkerLoad ? "已加計" : "無"})</td>
                                <td className="px-3 py-2.5 text-right font-extrabold text-amber-600">{calcData.nodeLoad.toFixed(2)} kg</td>
                              </tr>

                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                  </div>

                  {/* 吳啓仲專業監工與法規提醒 */}
                  <div className="p-6 border-t border-slate-100 bg-slate-50/50">
                    <h3 className="text-sm font-black text-slate-800 mb-2.5 flex items-center gap-2">
                      <AlertTriangleIcon />
                      吳啓仲 工程現場查驗盲點與工法規範：
                    </h3>
                    <ul className="text-xs text-slate-700 space-y-2 list-disc list-inside font-semibold leading-relaxed">
                      <li><strong>結構樑硬支撐必要性：</strong> 凡管線跨越主體結構樑，必須強制採用型鋼門型架或三角托架（SP26 / SP40 / SP42），嚴禁單純使用下吊全牙螺桿懸吊，以防地震側向剪力折損吊桿。</li>
                      <li><strong>防電位差腐蝕隔離：</strong> 不鏽鋼管 (SUS304) 電位與鍍鋅型鋼差異巨大，接觸面必須墊設絕緣橡膠片或橡塑墊木，嚴禁直接與金屬硬接觸，避免異種金屬電位咬穿管壁。</li>
                      <li><strong>銲接及冷鍍鋅防腐：</strong> 所有型鋼及焊接底板若經現場砂輪切割、滿焊結合，表面鋅防護層即遭破壞，必須清除藥渣後塗刷兩道以上富鋅防銹底漆（含鋅量達90%以上）進行修補。</li>
                    </ul>
                  </div>

                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // 啟動與掛載 React，延遲模擬以顯示 Loading 動畫防呆
    setTimeout(() => {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    }, 100);
  </script>
</body>
</html>
