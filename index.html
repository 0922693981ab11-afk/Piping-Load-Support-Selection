        { sizeStr: "E39 (1-1/4\")", inch: 1.25, D: 38.1, t: 1.4, w: 1.27 },

        { sizeStr: "E75 (2-1/2\")", inch: 2.5, D: 76.2, t: 1.8, w: 3.30 }
      ]
    };

    // --- 從嚴設計：橫向配管支撐間隔對照表 ---
    const spacingDatabase = {
      "鍍鋅鋼管/RSG厚管": [
        { limit: 20, spacing: 1.5 }, 
        { limit: 40, spacing: 1.8 }, 
        { limit: 80, spacing: 2.5 }, 
        { limit: 150, spacing: 3.5 }, 
        { limit: 999, spacing: 4.0 }  
      ],
      "EMT薄鋼電線管": [
        { limit: 20, spacing: 0.8 },
        { limit: 40, spacing: 1.2 },
        { limit: 50, spacing: 1.5 },
        { limit: 999, spacing: 1.5 }
      ]
    };

    const safetyFactors = [
      { label: "一般流體靜態管路 (給排水 ×1.5)", factor: 1.5 },
      { label: "動態衝擊管路 (消防水錘 / 冰水泵浦 ×1.8)", factor: 1.8 },
      { label: "重級防震 / 化學危險管路 (×2.0)", factor: 2.0 }
    ];

    const supportStyles = [
      { id: "single", name: "單管懸吊吊架", desc: "鋼構或樓板錨定，以螺桿下吊雙層管束。" },
      { id: "trapeze", name: "門型型鋼排架", desc: "多管共架！兩側支撐搭配橫擔型鋼固定。" },
      { id: "cantilever", name: "三角懸臂支架", desc: "牆面重型三角角鋼托架(SP42)，抗剪剛性大。" },
      { id: "riser", name: "樓板落地立管架", desc: "立管穿樓板專用雙片對鎖重型架(SP27)。" }
    ];

    const structureTypes = [
      { id: "rc", name: "RC 混凝土結構", desc: "依靠金屬膨脹螺栓或化學錨栓錨定。" },
      { id: "steel", name: "鋼骨結構(H/I型鋼)", desc: "依靠免電焊鋼構夾具（萬能夾）固定。" },
      { id: "roof", name: "鋼構斜屋頂/鐵皮房", desc: "需使用萬向鉸接吊架以調校垂直偏角。" }
    ];

    function App() {
      // 1. 模式與管材清單狀態
      const [supportMode, setSupportMode] = useState("single");
      const [pipeList, setPipeList] = useState([
        { id: Date.now(), standard: "CNS 6445 (一般配管碳鋼管)", pipeIndex: 8, qty: 1 }
      ]);
      const [safety, setSafety] = useState(safetyFactors[1].factor);
      
      // 2. 結構樑與工法設定
      const [styleId, setStyleId] = useState("single");
      const [isHardSupport, setIsHardSupport] = useState(true);
      const [structureId, setStructureId] = useState("rc");
      const [addVibration, setAddVibration] = useState(true);
      const [addSleeve, setAddSleeve] = useState(false);

      // 3. 進階負載參數
      const [useInsulation, setUseInsulation] = useState(false);
      const [addWorkerLoad, setAddWorkerLoad] = useState(false);
      const [hasHeavyValve, setHasHeavyValve] = useState(false);
      
      // 4. 其他狀態
      const [customSpacing, setCustomSpacing] = useState(null); 
      const [activeTab, setActiveTab] = useState("bom");

      const [calcData, setCalcData] = useState({ 
        totalEmptyW: 0, totalWaterW: 0, totalInsulationW: 0,
        totalDL: 0, recommendedSpacing: 3.5, activeSpacing: 3.5,
        nodeLoad: 0, valveWeight: 0, effectivePipeCount: 1,
        primaryInch: 4.0, isAnySUS: false, hasFireRisk: false,
        activeRuleName: "鍍鋅鋼管/RSG厚管"
      });

      // 新增管線列
      const addPipeRow = () => {
        setPipeList([...pipeList, { id: Date.now(), standard: "CNS 6445 (一般配管碳鋼管)", pipeIndex: 5, qty: 1 }]);
      };
      
      // 刪除管線列
      const removePipeRow = (targetId) => {
        if (pipeList.length > 1) {
          setPipeList(pipeList.filter(pipeItem => pipeItem.id !== targetId));
        }
      };

      // 安全更新管線屬性
      const updatePipeRow = (targetId, field, val) => {
        setPipeList(prevList => prevList.map(pipeItem => 
          pipeItem.id === targetId ? { ...pipeItem, [field]: val } : pipeItem
        ));
      };

      // 複合更新 (同時換材質與歸零管徑)
      const handleStandardChange = (targetId, newStandard) => {
        setPipeList(prevList => prevList.map(pipeItem => 
          pipeItem.id === targetId ? { ...pipeItem, standard: newStandard, pipeIndex: 0 } : pipeItem
        ));
      };
      
      // 當模式改變時處理防呆
      useEffect(() => {
        if (supportMode === "single") {
          setPipeList(prev => [{ ...prev[0], qty: 1 }]);
          if (styleId === "trapeze") setStyleId("single");
        } else {
          setStyleId("trapeze");
        }
      }, [supportMode]);

      // 動態應力與間距比對計算
      useEffect(() => {
        let sumEmptyW = 0, sumWaterW = 0, sumInsulationW = 0, sumDL = 0;
        let minSpacing = 999;
        let effectiveCount = 0;
        let maxInch = 0;
        let isAnySUS = false;
        let currentRuleName = "鍍鋅鋼管/RSG厚管";

        pipeList.forEach(pipeItem => {
          const pipeDataList = pipeData[pipeItem.standard];
          const spec = pipeDataList ? pipeDataList[pipeItem.pipeIndex] : null;
          if (!spec) return;

          const isElectrical = pipeItem.standard.includes("電線管") || pipeItem.standard.includes("EMT") || pipeItem.standard.includes("RSG");
          if (pipeItem.standard.includes("不鏽鋼")) isAnySUS = true;
          if (spec.inch > maxInch) maxInch = spec.inch;

          // 計算水重 (電線管無水重)
          const d = spec.D - (2 * spec.t);
          const waterW = isElectrical ? 0 : (0.000785 * Math.pow(d, 2));
          
          // 計算保溫 (電線管無保溫)
          let insulationW = 0;
          if (useInsulation && !isElectrical) {
            insulationW = spec.inch <= 2 ? 0.9 + (spec.D * 0.015) : 2.0 + (spec.D * 0.04);
          }

          const singlePipeW = spec.w + waterW + insulationW;
          const lineDL = singlePipeW * safety * pipeItem.qty;

          sumEmptyW += spec.w * pipeItem.qty;
          sumWaterW += waterW * pipeItem.qty;
          sumInsulationW += insulationW * pipeItem.qty;
          sumDL += lineDL;
          effectiveCount += pipeItem.qty;

          // 判斷間距 (取最嚴格)
          let dbKey = "鍍鋅鋼管/RSG厚管";
          if (pipeItem.standard.includes("EMT")) {
            dbKey = "EMT薄鋼電線管";
            currentRuleName = "EMT薄鋼電線管"; 
          }
          
          const ruleList = spacingDatabase[dbKey] || spacingDatabase["鍍鋅鋼管/RSG厚管"];
          const match = spec.sizeStr.match(/\d+/);
          const nominalValue = match ? parseInt(match[0], 10) : 20; 
          
          let rule = ruleList[ruleList.length - 1];
          for (let i = 0; i < ruleList.length; i++) {
             if (nominalValue <= ruleList[i].limit) {
               rule = ruleList[i];
               break;
             }
          }

          if (rule.spacing < minSpacing) {
            minSpacing = rule.spacing;
          }
        });

        const safeMinSpacing = minSpacing === 999 ? 3.5 : minSpacing;
        const activeSpacing = customSpacing !== null ? customSpacing : safeMinSpacing;

        // 閥件集中載重判斷 (取最大管徑)
        let currentValveWeight = 0;
        if (hasHeavyValve) {
          currentValveWeight = maxInch >= 4.0 ? 150 : 50; 
        }

        // 節點荷重 = (每公尺荷重 * 支架間距) + 活載重 + 閥件重
        let nodeLoadCalc = sumDL * activeSpacing;
        if (addWorkerLoad) nodeLoadCalc += 100;
        if (hasHeavyValve) nodeLoadCalc += currentValveWeight;

        const hasFireRisk = maxInch >= 2.5 && safety >= 1.8;

        setCalcData({
          totalEmptyW: sumEmptyW,
          totalWaterW: sumWaterW,
          totalInsulationW: sumInsulationW,
          totalDL: sumDL,
          recommendedSpacing: safeMinSpacing,
          activeSpacing: activeSpacing,
          nodeLoad: nodeLoadCalc,
          valveWeight: currentValveWeight,
          effectivePipeCount: effectiveCount,
          primaryInch: maxInch,
          isAnySUS: isAnySUS,
          hasFireRisk: hasFireRisk,
          activeRuleName: currentRuleName
        });
      }, [pipeList, safety, useInsulation, addWorkerLoad, customSpacing, hasHeavyValve, supportMode]);

      // 取得特定管徑的 U-Bolt 型號
      const getUBoltCode = (inch) => {
        if (inch <= 0.5) return "U304"; if (inch <= 0.75) return "U306";
        if (inch <= 1.0) return "U310"; if (inch <= 1.5) return "U314";
        if (inch <= 2.0) return "U320"; if (inch <= 2.5) return "U324";
        if (inch <= 3.0) return "U430"; if (inch <= 4.0) return "U440";
        if (inch <= 6.0) return "U460"; if (inch <= 8.0) return "U580";
        if (inch <= 10.0) return "U5100"; return "U6120";
      };

      // 取得特定管徑的 ST管束 型號
      const getSTBandCode = (inch) => {
        if (inch <= 1.0) return "ST310"; if (inch <= 2.0) return "ST320";
        if (inch <= 4.0) return "ST440"; if (inch <= 6.0) return "ST560";
        if (inch <= 8.0) return "ST680"; return "ST6120";
      };

      // 綜合媒合與 CAD 大樣參數
      const getCatalogMatch = () => {
        const nodeL = calcData.nodeLoad;
        const inch = calcData.primaryInch;

        let res = {
          rod: { code: "", diameter: "", load: "" },
          angle: { code: "", specs: "", weight: "" },
          channel: { code: "", specs: "", weight: "", plate: "" },
          vibration: { code: "", specs: "", loadRange: "", color: "", hex: "" },
          couplingNut: { code: "", specs: "", load: "" },
          steelClamp: { code: "", specs: "", load: "" },
          seismic: { code: "", specs: "" } 
        };

        if (nodeL <= 112) { res.rod = { code: "T2100", diameter: "1/4\"", load: "112 kg" }; res.couplingNut = { code: "SK20", specs: "1/4\"", load: "400 kg" }; }
        else if (nodeL <= 282) { res.rod = { code: "T3100", diameter: "3/8\"", load: "282 kg" }; res.couplingNut = { code: "SK30", specs: "3/8\"", load: "520 kg" }; }
        else if (nodeL <= 502) { res.rod = { code: "T4100", diameter: "1/2\"", load: "502 kg" }; res.couplingNut = { code: "SK40", specs: "1/2\"", load: "690 kg" }; }
        else if (nodeL <= 839) { res.rod = { code: "T5100", diameter: "5/8\"", load: "839 kg" }; res.couplingNut = { code: "SK50", specs: "5/8\"", load: "1160 kg" }; }
        else if (nodeL <= 1255) { res.rod = { code: "T6100", diameter: "3/4\"", load: "1255 kg" }; res.couplingNut = { code: "SK60", specs: "3/4\"", load: "1130 kg" }; }
        else { res.rod = { code: "T6100 (雙拼/加粗)", diameter: "3/4\" x2", load: "2500 kg+" }; res.couplingNut = { code: "SK60", specs: "3/4\"", load: "1130 kg" }; }

        // 型鋼槽鋼或角鋼判定 (補回非硬支撐時的槽鋼邏輯)
        if (nodeL > 2000) { res.channel = { code: "H-BEAM 150x150", specs: "H型鋼", weight: "31.5 kg/m", plate: "300x300x20t" }; }
        else if (nodeL > 1200) { res.channel = { code: "E1507565 (雙拼)", specs: "150x75 槽鋼雙拼", weight: "37.2 kg/m", plate: "250x250x12t" }; }
        else if (nodeL > 600) { res.channel = { code: "E125656", specs: "125x65x6t", weight: "13.4 kg/m", plate: "200x200x6t" }; }
        else { res.channel = { code: "E100505", specs: "100x50x5t", weight: "9.36 kg/m", plate: "150x150x6t" }; }

        if (inch <= 2.5) { res.angle = { code: "AG 5035", specs: "50x50x3.5t L=3M", weight: "2.68 kg/m" }; }
        else if (inch <= 4.0) { res.angle = { code: "AG 505", specs: "50x50x5.0t L=3M", weight: "3.77 kg/m" }; }
        else { res.angle = { code: "AG 756", specs: "75x75x6.0t L=3M", weight: "6.85 kg/m" }; }

        const springs = [
          { maxLoad: 50, code: "JH-050-S", constant: "2.0 kg/mm", color: "紅 (Red)", hex: "#dc2626" },
          { maxLoad: 100, code: "JH-090-S", constant: "3.6 kg/mm", color: "褐 (Brown)", hex: "#78350f" },
          { maxLoad: 150, code: "JH-150-S", constant: "6.0 kg/mm", color: "白 (White)", hex: "#cbd5e1" }
        ];
        
        let matchedSpring = springs[springs.length - 1];
        for (let i = 0; i < springs.length; i++) {
           if (nodeL <= springs[i].maxLoad) {
             matchedSpring = springs[i];
             break;
           }
        }
        
        if (nodeL > 150) {
            matchedSpring = { code: "JH-350-R (重型/陣列)", constant: "—", color: "黑 (Rubber)", hex: "#1e293b" };
        }

        res.vibration = {
          code: matchedSpring.code,
          specs: `撓度25mm | 係數:${matchedSpring.constant}`,
          loadRange: `單點允許: ${matchedSpring.maxLoad ? matchedSpring.maxLoad : '350+'} kg`,
          color: matchedSpring.color,
          hex: matchedSpring.hex
        };

        const threadSize = res.rod.diameter;
        if (structureId === "steel") {
          if (threadSize === "3/8\"") { res.steelClamp = { code: "HKA336", specs: "孔徑 3/8\" | 夾片 36mm 鑄鐵", load: "允許荷重 500kg+" }; }
          else if (threadSize === "1/2\"") { res.steelClamp = { code: "HKA436", specs: "孔徑 1/2\" | 夾片 36mm 鑄鐵", load: "允許荷重 690kg" }; }
          else if (threadSize === "5/8\"") { res.steelClamp = { code: "HKA538", specs: "孔徑 5/8\" | 夾片 38mm 鑄鐵", load: "允許荷重 1160kg" }; }
          else { res.steelClamp = { code: "HKA638", specs: "孔徑 3/4\" | 夾板 38mm 鑄鐵", load: "允許荷重 1255kg" }; }
        } else if (structureId === "roof") {
          if (threadSize === "3/8\"") { res.steelClamp = { code: "HKD336", specs: "萬向鉸接 | 孔徑 3/8\"", load: "垂直 100kg | 傾斜 40kg" }; }
          else { res.steelClamp = { code: "HKD436", specs: "萬向鉸接 | 孔徑 1/2\"", load: "垂直 110kg | 傾斜 40kg" }; }
        } else {
          res.steelClamp = { code: "HKA336", specs: "孔徑 3/8\" | 鑄鐵重載型", load: "允許荷重 500kg" };
        }

        if (calcData.hasFireRisk) {
          res.seismic = { code: "SCT 內牙斜撐組件", specs: "縱向24M、橫向12M (依 NFPA 13)" };
        }

        return res;
      };

      const matchedCatalog = getCatalogMatch();

      const getCADDetails = () => {
        let details = {

          riserClamp: { 
            code: "SP27-R",

            code: "SP42",

      const cad = getCADDetails();

                  <text x="80" y="195" fill="#94a3b8" className="text-[9px] font-mono">橫擔:{cad.beamHanger.member} | 底板:{cad.beamHanger.basePlate}</text>
                  
                  {Array.from({length: visualPipes}).map((_, idx) => {
                    const spacingVal = visualPipes > 1 ? 210 / (visualPipes - 1) : 0;
                    const cx = visualPipes === 1 ? 160 : 55 + (spacingVal * idx);
                    return (
                      <g key={idx}>
                        <circle cx={cx} cy="140" r="16" fill={pipeFill} stroke="#1e293b" strokeWidth="2" />

                      </g>

                  {calcData.effectivePipeCount > 4 && <text x="260" y="145" fill="#cbd5e1" className="text-[12px] font-bold">+{calcData.effectivePipeCount - 4}</text>}
                  
                  <rect x="5" y="215" width="310" height="30" fill="#1e293b" rx="6" />
                  <text x="15" y="233" fill="#10b981" className="text-xs font-bold">工法：SP26 / SP40 重型型鋼門型硬支撐架 ({calcData.effectivePipeCount}管共架)</text>
                </svg>
              );
            } else {
              return (
                <svg viewBox="0 0 320 250" className="w-full h-56 bg-slate-900 rounded-xl border border-slate-800 shadow-inner">

                  <rect x="40" y="150" width="240" height="15" fill="#1e293b" stroke="#64748b" strokeWidth="2" rx="1" />
                  <text x="80" y="175" fill="#94a3b8" className="text-[9px] font-mono">橫擔:{cad.beamHanger.member}</text>
                  
                  {Array.from({length: visualPipes}).map((_, idx) => {
                    const spacingVal = visualPipes > 1 ? 180 / (visualPipes - 1) : 0;
                    const cx = visualPipes === 1 ? 160 : 70 + (spacingVal * idx);
                    return (
                      <g key={idx}>
                        <circle cx={cx} cy="125" r="16" fill={pipeFill} stroke="#334155" strokeWidth="2" />
                        <path d={`M${cx-16},125 C${cx-16},103 ${cx+16},103 ${cx+16},125 L${cx+16},150 L${cx-16},150`} fill="none" stroke="#94a3b8" strokeWidth="3" />
                      </g>
                    );
                  })}
                  {calcData.effectivePipeCount > 4 && <text x="260" y="130" fill="#cbd5e1" className="text-[12px] font-bold">+{calcData.effectivePipeCount - 4}</text>}
                  
                  <rect x="5" y="215" width="310" height="30" fill="#1e293b" rx="6" />
                  <text x="15" y="233" fill="#38bdf8" className="text-xs font-bold">工法：常規雙全牙吊桿橫擔吊架 ({calcData.effectivePipeCount}管共架)</text>
                </svg>
              );
            }

          case "cantilever":
            return (
              <svg viewBox="0 0 320 250" className="w-full h-56 bg-slate-900 rounded-xl border border-slate-800 shadow-inner">
                <rect x="0" y="20" width="80" height="200" fill="#475569" />
                <line x1="80" y1="20" x2="80" y2="220" stroke="#1e293b" strokeWidth="3" />
                <text x="10" y="110" fill="#cbd5e1" className="text-[10px] font-bold rotate-90 origin-center">RC 結構樑/牆面</text>
                <polygon points="80,70 230,120 80,170" fill="#1e293b" stroke="#cbd5e1" strokeWidth={isHardSupport? "2.5" : "1"} />
                <line x1="80" y1="120" x2="230" y2="120" stroke={isHardSupport?"#10b981":"#38bdf8"} strokeWidth="4" />
                <text x="90" y="145" fill="#10b981" className="text-[9px] font-mono">SP42-50x50x6t 角鋼架</text>
                
                {Array.from({length: visualPipes}).map((_, idx) => {
                    const cx = 115 + (idx * 35);
                    return (
                      <g key={idx}>
                        <circle cx={cx} cy="95" r="14" fill={pipeFill} stroke="#1e293b" strokeWidth="2" />
                        <path d={`M${cx-16},95 C${cx-16},65 ${cx+16},65 ${cx+16},95 L${cx+16},120 L${cx-16},120`} fill="none" stroke="#fbbf24" strokeWidth="3" />
                      </g>
                    );
                })}

                {hasHeavyValve && <rect x="95" y="65" width="40" height="40" fill="none" stroke="#ef4444" strokeWidth="3" strokeDasharray="4,2"/>}
                <rect x="5" y="215" width="310" height="30" fill="#1e293b" rx="6" />
                <text x="15" y="233" fill={isHardSupport?"#10b981":"#38bdf8"} className="text-xs font-bold">工法：SP42 三角托架 ({calcData.effectivePipeCount}管共架)</text>
              </svg>
            );

          case "riser":
            return (
              <svg viewBox="0 0 320 250" className="w-full h-56 bg-slate-900 rounded-xl border border-slate-800 shadow-inner">
                <rect x="0" y="110" width="95" height="30" fill={isHardSupport?"#334155":"#475569"} />

                <line x1="0" y1="140" x2="320" y2="140" stroke="#1e293b" strokeWidth="2" />

      };

      };

      return (

              <div className="flex items-center gap-5">
                <div className="bg-emerald-500 p-4 rounded-2xl shadow-xl animate-pulse">

                </div>

                  <h1 className="text-2xl md:text-4xl font-black tracking-wider bg-gradient-to-r from-white via-emerald-100 to-emerald-300 bg-clip-text text-transparent">

                  </h1>
                  <p className="text-slate-400 mt-2 text-xs md:text-sm font-medium">

                </div>

              <div className="bg-slate-800 px-6 py-4 rounded-2xl border border-slate-700 self-start md:self-auto text-center shadow-lg">
                <div className="text-[10px] text-slate-400 font-extrabold uppercase tracking-widest mb-1">系統授權與研發維護</div>
                <div className="text-emerald-400 font-black text-xl tracking-wide font-mono">
                  程式開發者 吳啓仲
                </div>

            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* 左欄：參數輸入 */}
              <div className="lg:col-span-5 space-y-6">
                
                {/* 1. 管材與安全條件 */}
                <div className="bg-white rounded-3xl p-6 shadow-lg border border-slate-200">
                  <h2 className="text-lg font-black text-slate-900 mb-5 flex items-center gap-2.5 border-b pb-3 border-slate-100">
                    <SettingsIcon /> 1. 支撐模式與管線參數
                  </h2>

                  <div className="flex bg-slate-100 p-1.5 rounded-2xl mb-6 shadow-inner">

                      單支配管支撐
                    </button>
                    <button onClick={() => setSupportMode("shared")} className={`flex-1 py-3 text-sm font-bold rounded-xl transition-all ${supportMode === "shared" ? 'bg-white text-emerald-700 shadow-md' : 'text-slate-500 hover:text-slate-700'}`}>

                  <div className="space-y-4">
                    {pipeList.map((pipeItem, index) => (

                        <div className="absolute -top-3 left-4 bg-emerald-100 text-emerald-800 text-[10px] font-black px-2 py-0.5 rounded-lg border border-emerald-200">

                        </div>

                            <TrashIcon />

                        <div className="grid grid-cols-1 md:grid-cols-12 gap-3 mt-2">

                                  </td>
                                  <td className="px-3 py-3 text-slate-600 border-r border-slate-200">允許拉力 {matchedCatalog.couplingNut.load}</td>
                                  <td className="px-3 py-3 text-slate-500 font-bold">圓型SK / 六角SKH</td>
                                </tr>
                              )}

                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                    {/* 頁面 B：力學計算底稿 */}
                    {activeTab === "formula" && (
                      <div className="space-y-4">
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-black text-slate-400 uppercase tracking-widest">Excel 內部力學公式試算底稿</span>
                          <span className="text-xs text-blue-600 font-bold bg-blue-50 px-2 py-1 rounded-lg">容許最大間距</span>
                        </div>
                        <div className="overflow-x-auto border border-slate-200 rounded-xl shadow-inner no-scrollbar">
                          <table className="min-w-full divide-y divide-slate-200 text-xs font-mono whitespace-nowrap">
                            <thead className="bg-slate-100 border-b border-slate-200">
                              <tr>
                                <th className="px-3 py-3 text-left text-slate-700 font-black border-r border-slate-200">工作格編號</th>
                                <th className="px-3 py-3 text-left text-slate-700 font-black border-r border-slate-200">力學參數</th>
                                <th className="px-3 py-3 text-left text-slate-700 font-black border-r border-slate-200">計算公式 / Formulation</th>
                                <th className="px-3 py-3 text-right text-slate-700 font-black">試算結果 (數值)</th>
                              </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-slate-200">
                              
                              <tr>
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-01</td>
                                <td className="px-3 py-2.5 font-bold text-slate-800 border-r border-slate-200">鋼材本體總重 (ΣWs)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">Σ [0.02466*t*(D-t) * 數量]</td>
                                <td className="px-3 py-2.5 text-right font-bold text-slate-800">{calcData.totalEmptyW.toFixed(2)} kg/m</td>
                              </tr>

                              <tr className="bg-slate-50/30">
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-02</td>
                                <td className="px-3 py-2.5 font-bold text-slate-800 border-r border-slate-200">管內滿水總重 (ΣWw)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">Σ [0.000785*(D-2t)^2 * 數量] (電線管不計)</td>
                                <td className="px-3 py-2.5 text-right font-bold text-slate-800">{calcData.totalWaterW.toFixed(2)} kg/m</td>
                              </tr>

                              <tr>
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-03</td>
                                <td className="px-3 py-2.5 font-bold text-slate-800 border-r border-slate-200">保溫防露層總重 (ΣWi)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">{useInsulation ? "依各管徑幾何估算加總" : "無 (未勾選)"}</td>
                                <td className="px-3 py-2.5 text-right font-bold text-slate-800">{calcData.totalInsulationW.toFixed(2)} kg/m</td>
                              </tr>

                              <tr className="bg-slate-50/30">
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-04</td>
                                <td className="px-3 py-2.5 font-bold text-slate-800 border-r border-slate-200">管架總設計均佈荷重 (DL)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">(ΣWs + ΣWw + ΣWi) * 安全係數({safety})</td>
                                <td className="px-3 py-2.5 text-right font-bold text-slate-800">{calcData.totalDL.toFixed(2)} kg/m</td>
                              </tr>

                              <tr>
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-05</td>
                                <td className="px-3 py-2.5 font-bold text-slate-800 border-r border-slate-200">最嚴格容許支架跨距 (M)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">Min(各管材規範限制跨距)</td>
                                <td className="px-3 py-2.5 text-right font-bold text-slate-800">{calcData.activeSpacing.toFixed(1)} M</td>
                              </tr>

                              {hasHeavyValve && (
                                <tr className="bg-red-50/30">
                                  <td className="px-3 py-2.5 text-red-500 font-bold border-r border-slate-200">C-05V</td>
                                  <td className="px-3 py-2.5 font-bold text-red-800 border-r border-slate-200">附加閥件集中載重 (Point)</td>
                                  <td className="px-3 py-2.5 text-red-600 border-r border-slate-200">法蘭與大型閥門額外點載重</td>
                                  <td className="px-3 py-2.5 text-right font-extrabold text-red-600">+{calcData.valveWeight.toFixed(2)} kg</td>
                                </tr>
                              )}

                              <tr className="bg-amber-50/30">
                                <td className="px-3 py-2.5 text-slate-500 font-bold border-r border-slate-200">C-06</td>
                                <td className="px-3 py-2.5 font-bold text-slate-900 border-r border-slate-200">節點極限受力總荷重 (Node Load)</td>
                                <td className="px-3 py-2.5 text-slate-600 border-r border-slate-200">DL * 跨距 + 活載重{hasHeavyValve ? ' + 閥件重' : ''}</td>
                                <td className="px-3 py-2.5 text-right font-extrabold text-amber-600">{calcData.nodeLoad.toFixed(2)} kg</td>
                              </tr>

                            </tbody>
                          </table>
                        </div>
                      </div>
                    )}

                  </div>

                  {/* 吳啓仲專業監工與法規提醒 */}
                  <div className="p-6 border-t border-slate-100 bg-slate-50/50">
                    <h3 className="text-sm font-black text-slate-800 mb-2.5 flex items-center gap-2">
                      <AlertTriangleIcon />
                      工程現場查驗重點與工法規範：
                    </h3>
                    <ul className="text-xs text-slate-700 space-y-2 list-disc list-inside font-semibold leading-relaxed">
                      <li><strong>EMT與RSG電線管共架保護：</strong> 電線管路雖然無水重，但 EMT 管之容許最大支撐間距極短 (1.0m ~ 1.5m)。當 EMT 與大型水管共架時，整段管架系統之間距必須「從嚴」配合 EMT 管之限制，否則電管易下垂變形。</li>
                      <li><strong>閥件與設備節點支撐：</strong> 管道上若配置有重型閘閥、逆止閥等，因其集中載重（Point Load）巨大，該節點必須強制採用「雙拼槽鋼」或「落地硬支撐」。</li>
                      <li><strong>抗震斜撐 (Seismic Bracing)：</strong> 依據 NFPA 13 規範，凡消防系統主幹管（管徑 ≧ 65A），必須於直管段強制設置橫向與縱向防搖斜撐。</li>
                      <li><strong>不鏽鋼管熱應力釋放：</strong> 不鏽鋼管 (SUS304) 接觸面必須墊設絕緣橡塑墊木防電位腐蝕。且對於溫差極大之空調冰水/熱水系統，U 型管束需嚴格區分「固定點 (Anchor)」與「導向點 (Guide)」設定。</li>
                    </ul>
                  </div>

                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // 啟動與掛載 React，延遲模擬以顯示 Loading 動畫防呆
    setTimeout(() => {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    }, 100);
  </script>
</body>
</html>
